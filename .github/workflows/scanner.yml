name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
  schedule:
    # Every 5 minutes, Monday through Sunday. The Python gate below uses
    # America/New_York so the clock remains correct through DST changes.
    - cron: "*/5 7-21 * * *"

permissions:
  contents: write

concurrency:
  group: liquidity-sweep-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize scanner for standalone execution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_sweep_scanner.py")
          s = p.read_text(encoding="utf-8")
          future = "from __future__ import annotations"
          if future in s:
              s = s.replace(future + "\n", "", 1)
              s = future + "\n\n" + s
          s = s.replace('SAVE_HTML = "sweep_dashboard.html"', 'SAVE_HTML = "index.html"', 1)
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          print("Scanner syntax check passed and production settings applied.")
          PY

      - name: Check EST scan window
        id: window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          minute = now.hour * 60 + now.minute
          reference_hours = (3, 10, 14)
          active = any(h * 60 + 5 <= minute <= h * 60 + 60 for h in reference_hours)

          print(f"Timestamp (EST): {now:%Y-%m-%d %H:%M:%S} EST")
          print("Reference candles: 03:00, 10:00, 14:00 EST")
          print(f"Scan window active: {active}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as f:
              f.write(f"active={'true' if active else 'false'}\n")
          PY

      - name: Skip outside scan windows
        if: steps.window.outputs.active != 'true'
        run: echo "Outside the 1-hour post-reference scan windows; no scanner run needed."

      - name: Run scanner
        if: steps.window.outputs.active == 'true'
        run: python liquidity_sweep_scanner.py

      - name: Label dashboard timestamps as EST
        if: steps.window.outputs.active == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          s = s.replace(" NY", " EST")
          p.write_text(s, encoding="utf-8")
          PY

      - name: Notify Discord + Telegram for new SWEEP/REVERSAL signals
        if: steps.window.outputs.active == 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timedelta
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo
          import liquidity_sweep_scanner as scanner

          TZ = ZoneInfo("America/New_York")
          now = datetime.now(TZ)
          reference = None
          for h in scanner.CFG.session_hours:
              ss = now.replace(hour=h, minute=0, second=0, microsecond=0)
              if ss + timedelta(minutes=5) <= now <= ss + timedelta(minutes=scanner.CFG.window_minutes):
                  reference = ss
                  break
          if reference is None:
              raise SystemExit("No active reference window.")

          # The scanner has already run above; replay its recent scan in memory
          # to obtain structured signals for the current 1H reference window.
          sig_df, _ = scanner.scan_history(scanner._selected_assets(), days=scanner.SCAN_DAYS, cfg=scanner.CFG, verbose=False)

          current = []
          if sig_df is not None and not sig_df.empty:
              for row in sig_df.to_dict("records"):
                  ss = row.get("session_start")
                  if hasattr(ss, "to_pydatetime"):
                      ss = ss.to_pydatetime()
                  if ss is None:
                      continue
                  if ss.tzinfo is None:
                      ss = ss.replace(tzinfo=TZ)
                  ss = ss.astimezone(TZ)
                  if ss != reference:
                      continue
                  ts = row.get("time")
                  if hasattr(ts, "to_pydatetime"):
                      ts = ts.to_pydatetime()
                  if ts is None or ts.astimezone(TZ) > now:
                      continue
                  if row.get("kind") not in ("SWEEP", "REVERSAL"):
                      continue
                  current.append(row)

          state_path = ".signal_state.json"
          try:
              sent = set(json.loads(open(state_path, encoding="utf-8").read()))
          except (FileNotFoundError, json.JSONDecodeError):
              sent = set()

          def key(s):
              ts = s.get("time")
              if hasattr(ts, "isoformat"):
                  ts = ts.isoformat()
              return "|".join(str(s.get(k, "")) for k in ("asset", "session", "kind", "side")) + "|" + str(ts)

          def scalar(v):
              try:
                  return v.item()
              except AttributeError:
                  return v

          def message(s):
              kind = s["kind"]
              emoji = "🟢" if kind == "REVERSAL" else "🟡"
              title = "REVERSAL CONFIRMED" if kind == "REVERSAL" else "LIQUIDITY SWEEP"
              ts = s["time"]
              if hasattr(ts, "to_pydatetime"):
                  ts = ts.to_pydatetime()
              return (f"{emoji} {title}\n\n"
                      f"Asset: {s['asset']}\n"
                      f"Side: {s['side']}\n"
                      f"Reference: {reference:%Y-%m-%d %H:%M} EST\n"
                      f"Detected: {ts:%Y-%m-%d %H:%M} EST\n"
                      f"Price: {s['price']}\n"
                      f"{s['detail']}\n\n"
                      "Dashboard: https://compound0x.github.io/liquidity-sweep-reversal/")

          def post(url, payload):
              req = Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
              with urlopen(req, timeout=15) as r:
                  print(f"Notification sent: HTTP {r.status}")

          fresh = [s for s in current if key(s) not in sent]
          print(f"Current-window signals: {len(current)}; new signals: {len(fresh)}")

          for s in fresh:
              msg = message(s)
              if os.environ.get("DISCORD_WEBHOOK_URL"):
                  post(os.environ["DISCORD_WEBHOOK_URL"], {"content": msg})
              else:
                  print("DISCORD_WEBHOOK_URL not configured; Discord skipped.")
              if os.environ.get("TELEGRAM_BOT_TOKEN") and os.environ.get("TELEGRAM_CHAT_ID"):
                  post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
                       {"chat_id": os.environ["TELEGRAM_CHAT_ID"], "text": msg})
              else:
                  print("Telegram secrets not configured; Telegram skipped.")
              sent.add(key(s))

          # Keep only the newest 500 keys. This file is committed so duplicate
          # alerts are suppressed across separate 5-minute workflow runs.
          with open(state_path, "w", encoding="utf-8") as f:
              json.dump(list(sent)[-500:], f, indent=2)
          PY

      - name: Persist notification state
        if: steps.window.outputs.active == 'true'
        run: |
          if [ -f .signal_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .signal_state.json
            if ! git diff --cached --quiet; then
              git commit -m "Update signal notification state"
              git push
            fi
          fi

      - name: Verify dashboard
        if: steps.window.outputs.active == 'true'
        run: test -s index.html

      - name: Deploy dashboard to GitHub Pages
        if: steps.window.outputs.active == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          force_orphan: true
