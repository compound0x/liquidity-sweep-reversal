name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
    inputs:
      test_notification:
        description: "Send a Telegram test alert without waiting for a scan window"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 7-21 * * *"

permissions:
  contents: write

concurrency:
  group: liquidity-sweep-scanner
  cancel-in-progress: true

env:
  TEST_NOTIFICATION: ${{ inputs.test_notification || 'false' }}

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Telegram notifications
        if: env.TEST_NOTIFICATION == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          msg = "🧪 LIQUIDITY SWEEP SCANNER TEST\n\nThis is a test notification from GitHub Actions.\nNo trading signal was generated.\n\nDashboard: https://compound0x.github.io/liquidity-sweep-reversal/"

          def send(label, url, payload):
              try:
                  req = Request(url, data=json.dumps(payload).encode(), headers={"Content-Type": "application/json"}, method="POST")
                  with urlopen(req, timeout=15) as r:
                      print(f"{label}: HTTP {r.status}")
              except HTTPError as e:
                  body = e.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"{label} returned HTTP {e.code}: {body}") from e
              except URLError as e:
                  raise RuntimeError(f"{label} connection failed: {e.reason}") from e

          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if token and chat:
              send("Telegram", f"https://api.telegram.org/bot{token}/sendMessage", {"chat_id": chat, "text": msg})
          else:
              print("Telegram secrets are not configured; skipping Telegram test.")
          PY

      - name: Stop after notification test
        if: env.TEST_NOTIFICATION == 'true'
        run: echo "Notification test completed. Normal scan was intentionally skipped."

      - name: Normalize scanner for standalone execution
        if: env.TEST_NOTIFICATION != 'true'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_sweep_scanner.py")
          s = p.read_text(encoding="utf-8")
          future = "from __future__ import annotations"
          if future in s:
              s = s.replace(future + "\n", "", 1)
              s = future + "\n\n" + s
          s = s.replace('SAVE_HTML = "sweep_dashboard.html"', 'SAVE_HTML = "index.html"', 1)
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          print("Scanner syntax check passed and production settings applied.")
          PY

      - name: Check EST scan window
        id: window
        if: env.TEST_NOTIFICATION != 'true'
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          now = datetime.now(ZoneInfo("America/New_York"))
          minute = now.hour * 60 + now.minute
          active = any(h * 60 + 5 <= minute <= h * 60 + 60 for h in (3, 10, 14))
          print(f"Timestamp (EST/EDT): {now:%Y-%m-%d %H:%M:%S %Z}")
          print(f"Scan window active: {active}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as f:
              f.write(f"active={'true' if active else 'false'}\n")
          PY

      - name: Skip outside scan windows
        if: env.TEST_NOTIFICATION != 'true' && steps.window.outputs.active != 'true'
        run: echo "Outside the 1-hour post-reference scan windows; no scanner run needed."

      - name: Run scanner and notify Telegram
        if: env.TEST_NOTIFICATION != 'true' && steps.window.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notify_signals.py

      - name: Verify dashboard
        if: env.TEST_NOTIFICATION != 'true' && steps.window.outputs.active == 'true'
        run: test -s index.html

      - name: Deploy dashboard to GitHub Pages
        if: env.TEST_NOTIFICATION != 'true' && steps.window.outputs.active == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          force_orphan: true
