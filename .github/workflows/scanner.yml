name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions schedules are UTC. We run every 5 minutes across the
    # broad NY-time range that covers all three reference windows in both
    # EST and EDT, then gate the actual scan using America/New_York.
    - cron: "*/5 7-21 * * 1-5"

permissions:
  contents: write

concurrency:
  group: liquidity-sweep-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize scanner for standalone execution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_sweep_scanner.py")
          s = p.read_text(encoding="utf-8")
          future = "from __future__ import annotations"
          if future in s:
              s = s.replace(future + "\n", "", 1)
              s = future + "\n\n" + s
          s = s.replace('SAVE_HTML = "sweep_dashboard.html"', 'SAVE_HTML = "index.html"', 1)
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          print("Scanner syntax check passed and production settings applied.")
          PY

      - name: Check New York scan window
        id: window
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          minute = now.hour * 60 + now.minute

          # Run at 10:05 through 10:55 for the 10:00 reference candle,
          # and at 11:00 as the final check for that one-hour window.
          # Equivalent windows apply to 03:00 and 14:00 reference candles.
          reference_hours = (3, 10, 14)
          active = any(h * 60 + 5 <= minute <= h * 60 + 60 for h in reference_hours)

          print(f"New York time: {now:%Y-%m-%d %H:%M:%S %Z}")
          print(f"Scan window active: {active}")
          with open("$GITHUB_OUTPUT", "a", encoding="utf-8") as f:
              f.write(f"active={'true' if active else 'false'}\n")
          PY

      - name: Skip outside scan windows
        if: steps.window.outputs.active != 'true'
        run: echo "Outside the 1-hour post-reference scan windows; no scanner run needed."

      - name: Run liquidity sweep scanner
        if: steps.window.outputs.active == 'true'
        run: python liquidity_sweep_scanner.py

      - name: Verify dashboard
        if: steps.window.outputs.active == 'true'
        run: test -s index.html

      - name: Deploy dashboard to GitHub Pages
        if: steps.window.outputs.active == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          force_orphan: true
