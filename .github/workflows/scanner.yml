name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
    inputs:
      scan_window_override:
        description: "Run the real scanner now even outside the normal scan windows"
        required: false
        type: boolean
        default: false
      test_notification:
        description: "Send a Telegram test alert only"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: liquidity-sweep-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Telegram notification
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json, os
          from urllib.request import Request, urlopen
          token = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip()
          chat = os.environ.get("TELEGRAM_CHAT_ID", "").strip()
          if not token or not chat:
              raise RuntimeError("TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID must be configured.")
          msg = "🧪 LIQUIDITY SWEEP SCANNER TEST\n\nNo trading signal was generated.\n\nDashboard: https://compound0x.github.io/liquidity-sweep-reversal/"
          req = Request(f"https://api.telegram.org/bot{token}/sendMessage", data=json.dumps({"chat_id": chat, "text": msg}).encode(), headers={"Content-Type": "application/json"}, method="POST")
          with urlopen(req, timeout=15) as r:
              print(f"Telegram: HTTP {r.status}")
          PY

      - name: Stop after notification test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_notification }}
        run: echo "Notification test completed; scanner skipped by request."

      - name: Normalize scanner
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_sweep_scanner.py")
          s = p.read_text(encoding="utf-8")
          future = "from __future__ import annotations"
          if future in s:
              s = s.replace(future + "\n", "", 1)
              s = future + "\n\n" + s
          s = s.replace('SAVE_HTML = "sweep_dashboard.html"', 'SAVE_HTML = "index.html"', 1)
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          PY

      - name: Decide whether to scan
        id: gate
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          now = datetime.now(ZoneInfo("America/New_York"))
          minute = now.hour * 60 + now.minute
          normal = any(h * 60 + 5 <= minute <= h * 60 + 60 for h in (3, 10, 14))
          manual = os.getenv("GITHUB_EVENT_NAME") == "workflow_dispatch"
          override = manual and os.getenv("OVERRIDE_INPUT", "false").strip().lower() == "true"
          allowed = normal or override

          print(f"Timestamp (New York): {now:%Y-%m-%d %H:%M:%S %Z}")
          print("Normal windows: 03:05-04:00, 10:05-11:00, 14:05-15:00")
          print(f"Normal window active: {normal}")
          print(f"Workflow event: {os.getenv('GITHUB_EVENT_NAME')}")
          print(f"Manual override input: {os.getenv('OVERRIDE_INPUT')}")
          print(f"Manual override active: {override}")
          print(f"Scanner allowed to run: {allowed}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"active={'true' if allowed else 'false'}\n")
          PY
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          OVERRIDE_INPUT: ${{ inputs.scan_window_override }}

      - name: Skip outside scan windows
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) && steps.gate.outputs.active != 'true' }}
        run: echo "Outside the normal scan windows and no manual override was selected; scanner skipped."

      - name: Run scanner
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) && steps.gate.outputs.active == 'true' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SCAN_WINDOW_OVERRIDE: ${{ github.event_name == 'workflow_dispatch' && inputs.scan_window_override || false }}
        run: python notify_signals.py

      - name: Verify dashboard
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) && steps.gate.outputs.active == 'true' }}
        run: |
          echo "Checking generated dashboard..."
          ls -lah index.html || true
          test -s index.html

      - name: Persist notification deduplication state
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) && steps.gate.outputs.active == 'true' && hashFiles('alert_state.json') != '' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add alert_state.json
          if git diff --cached --quiet; then
            echo "No notification state changes to commit."
          else
            git commit -m "Persist Telegram notification deduplication state"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Deploy dashboard to GitHub Pages
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.test_notification) && steps.gate.outputs.active == 'true' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          force_orphan: true
