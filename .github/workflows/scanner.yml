name: Liquidity Sweep Scanner

on:
  workflow_dispatch:
  schedule:
    # Tue-Sat UTC covers Mon-Fri US sessions, including the Friday session.
    - cron: "15 1 * * 2-6"

permissions:
  contents: write

concurrency:
  group: liquidity-sweep-scanner
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Normalize scanner for standalone execution
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("liquidity_sweep_scanner.py")
          s = p.read_text(encoding="utf-8")
          future = "from __future__ import annotations"
          if future in s:
              s = s.replace(future + "\n", "", 1)
              s = future + "\n\n" + s
          s = s.replace('SAVE_HTML = "sweep_dashboard.html"', 'SAVE_HTML = "index.html"', 1)
          p.write_text(s, encoding="utf-8")
          compile(s, str(p), "exec")
          print("Scanner syntax check passed and production settings applied.")
          PY

      - name: Persist scanner normalization
        run: |
          if ! git diff --quiet -- liquidity_sweep_scanner.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add liquidity_sweep_scanner.py
            git commit -m "Fix scanner standalone execution and Pages output"
            git push
          fi

      - name: Run liquidity sweep scanner
        run: python liquidity_sweep_scanner.py

      - name: Verify dashboard
        run: test -s index.html

      - name: Deploy dashboard to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          keep_files: true
          force_orphan: true
